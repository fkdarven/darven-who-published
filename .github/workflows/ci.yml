name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          extensions: mysqli
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress 7.1 test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 7.1 true

      - name: Run integration tests
        run: composer test

      - name: Run coding standards
        run: composer phpcs

      - name: Build production plugin
        run: bash bin/build-plugin.sh

      - name: Verify production archive
        run: bash bin/verify-build.sh build/darven-who-published.1.1.0.zip

      - name: Upload production archive
        uses: actions/upload-artifact@v4
        with:
          name: darven-who-published-1.1.0
          path: build/darven-who-published.1.1.0.zip
          if-no-files-found: error

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/plugin/darven-who-published
          wp-version: '7.1'
          slug: darven-who-published
